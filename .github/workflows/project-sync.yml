name: Multi-Repo Project Sync

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every hour
  workflow_dispatch:   # Lets you click a button to run it manually

jobs:
  add-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Bulk Add Open Issues
        env:
          GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          ORGANIZATION: "kloudfuse-ext"
          # Change this number to your actual Project board number
          PROJECT_NUMBER: "9" 
        run: |
          # List your 8 specific repositories
          REPOS=(
            "customer-zscaler"
            "customer-AA"
            "customer-innovaccer"
            "customer-gehealthcare"
            "customer-nic"
            "customer-yubi"
            "customer-vymo"
            "customer-cactuscomm"
          )

          # Loop through each repository and add open issues
          for REPO in "${REPOS[@]}"; do
            echo "Checking repo: $REPO..."
            
            # Find all open issue URLs
            ISSUES=$(gh issue list --repo "$ORGANIZATION/$REPO" --state open --json url --jq '.[].url')

            for URL in $ISSUES; do
              echo "Adding $URL to project..."
              gh project item-add "$PROJECT_NUMBER" --owner "$ORGANIZATION" --url "$URL" --format json
            done
          done

