name: Multi-Repo Project Sync

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every hour
  workflow_dispatch:   # Lets you click a button to run it manually

jobs:
  add-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Bulk Add Open Issues
        env:
          GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          ORGANIZATION: "kloudfuse-ext"
          PROJECT_NUMBER: "9" # Replace with your actual project board number
        run: |
          # Explicitly authenticate the CLI environment using your token
          echo "$GH_TOKEN" | gh auth login --with-token 2>/dev/null

          REPOS=(
            "customer-zscaler"
            "customer-AA"
            "customer-innovaccer"
            "customer-gehealthcare"
            "customer-nic"
            "customer-yubi"
            "customer-vymo"
            "customer-cactuscomm"
          )

          for REPO in "${REPOS[@]}"; do
            echo "Checking repo: $REPO..."
            
            # The '|| true' statement prevents the script from crashing if one repo fails
            ISSUES=$(gh issue list --repo "$ORGANIZATION/$REPO" --state open --json url --jq '.[].url' 2>/dev/null) || true

            if [ -z "$ISSUES" ]; then
              echo "⚠️ Could not read or found 0 open issues in $REPO. Skipping..."
              continue
            fi

            for URL in $ISSUES; do
              echo "Adding $URL to project..."
              gh project item-add "$PROJECT_NUMBER" --owner "$ORGANIZATION" --url "$URL" --format json || true
            done
          done
