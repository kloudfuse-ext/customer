name: Multi-Repo Project Sync

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every hour
  workflow_dispatch:   # Lets you click a button to run it manually

jobs:
  add-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Bulk Add Open Issues
        env:
          GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          ORGANIZATION: "kloudfuse-ext"
          PROJECT_NUMBER: "9"
        run: |
          REPOS=(
            "customer-zscaler"
            "customer-AA"
            "customer-innovaccer"
            "customer-gehealthcare"
            "customer-nic"
            "customer-yubi"
            "customer-vymo"
            "customer-cactuscomm"
          )

          for REPO in "${REPOS[@]}"; do
            echo "Checking repo: $REPO..."
            
            # Safely fetch issue URLs. If the repo is empty or gives an error, it moves to the next repo.
            ISSUES=$(gh issue list --repo "$ORGANIZATION/$REPO" --state open --json url --jq '.[].url' 2>/dev/null) || { echo "⚠️ Could not read $REPO (check permissions). Skipping..."; continue; }

            if [ -z "$ISSUES" ]; then
              echo "No open issues found in $REPO."
              continue
            fi

            for URL in $ISSUES; do
              echo "Adding $URL to project..."
              gh project item-add "$PROJECT_NUMBER" --owner "$ORGANIZATION" --url "$URL" --format json || true
            done
          done
