# Elastic Beats (Filebeat) — Container Logs → Kloudfuse
#
# Deploys Filebeat as a Kubernetes DaemonSet via a direct manifest (no Helm).
# Uses the same Kloudfuse ingestion endpoint as the Helm-based Filebeat deployment.
#
# Note on Elastic Agent vs Filebeat:
#   Elastic Agent v8.x standalone mode requires Fleet enrollment to process inputs.
#   For container log collection without a Fleet/Kibana server, Filebeat is the
#   recommended approach. Both agents use the same /ingester/api/v1/filebeat endpoint.
#
# Replace <kloudfuse-hostname> and <token> before applying.
# Omit the Kf-Api-Key header if auth is not enabled.
#
# Deploy:
#   kubectl apply -f manifest.yaml
#
# Tear down:
#   kubectl delete -f manifest.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elastic-beats
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elastic-beats
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, events]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: elastic-beats
subjects:
  - kind: ServiceAccount
    name: elastic-beats
    namespace: logging
roleRef:
  kind: ClusterRole
  name: elastic-beats
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: elastic-beats-config
  namespace: logging
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: container
        paths:
          - /var/log/containers/*.log
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: "/var/log/containers/"

    # Required — Kloudfuse does not implement Elasticsearch index management APIs
    setup.ilm.enabled: false
    setup.template.enabled: false

    output.elasticsearch:
      hosts: ["https://<kloudfuse-hostname>:443/ingester/api/v1/filebeat"]
      headers:
        Kf-Api-Key: <token>   # omit if auth is not enabled
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: elastic-beats
  namespace: logging
  labels:
    app: elastic-beats
spec:
  selector:
    matchLabels:
      app: elastic-beats
  template:
    metadata:
      labels:
        app: elastic-beats
    spec:
      serviceAccountName: elastic-beats
      tolerations:
        - key: "owner"
          operator: "Equal"
          value: "steve"
          effect: "NoSchedule"
      volumes:
        - name: config
          configMap:
            name: elastic-beats-config
            items:
              - key: filebeat.yml
                path: filebeat.yml
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: data
          hostPath:
            path: /var/lib/elastic-beats
            type: DirectoryOrCreate
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.13.4
          args:
            - "-e"
            - "-c"
            - "/etc/filebeat/filebeat.yml"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat
              readOnly: true
            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: data
              mountPath: /usr/share/filebeat/data
