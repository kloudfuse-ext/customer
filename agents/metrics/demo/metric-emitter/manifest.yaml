# Metric Emitter — Prometheus /metrics endpoint
#
# Deploys a minimal Python pod that exposes a Prometheus-compatible /metrics
# endpoint on port 8000. Emits a set of synthetic application metrics that
# cycle through realistic values, making it easy to verify that scrapers
# (DD Agent, OTel Collector, Prometheus) are collecting and forwarding to Kloudfuse.
#
# Metrics emitted:
#   demo_requests_total{method, status}   — counter, incremented each cycle
#   demo_request_duration_seconds{method} — gauge, simulated latency
#   demo_active_connections               — gauge, random value 1–50
#   demo_errors_total{type}               — counter, incremented on error cycles
#
# Deploy:
#   kubectl apply -f manifest.yaml
#
# Verify the endpoint:
#   kubectl port-forward -n steve pod/metrics-demo 8000:8000
#   curl http://localhost:8000/metrics
---
apiVersion: v1
kind: Namespace
metadata:
  name: steve
---
apiVersion: v1
kind: Pod
metadata:
  name: metrics-demo
  namespace: steve
  labels:
    app: metrics-demo
  annotations:
    # Datadog Autodiscovery — scrape this pod's /metrics endpoint
    ad.datadoghq.com/metric-emitter.checks: |
      {
        "openmetrics": {
          "instances": [
            {
              "openmetrics_endpoint": "http://%%host%%:8000/metrics",
              "namespace": "demo",
              "metrics": ["demo_.*"]
            }
          ]
        }
      }
    # Prometheus scrape annotations (for OTel prometheusreceiver / kube-prometheus)
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  tolerations:
    - key: "owner"
      operator: "Equal"
      value: "steve"
      effect: "NoSchedule"
  containers:
    - name: metric-emitter
      image: python:3.12-slim
      ports:
        - containerPort: 8000
          name: metrics
      command:
        - python3
        - -c
        - |
          import http.server, time, random, threading

          counters = {
              "demo_requests_total_get_200": 0,
              "demo_requests_total_get_404": 0,
              "demo_requests_total_post_200": 0,
              "demo_requests_total_post_500": 0,
              "demo_errors_total_timeout": 0,
              "demo_errors_total_connection": 0,
          }

          def increment():
              while True:
                  counters["demo_requests_total_get_200"] += random.randint(5, 20)
                  counters["demo_requests_total_post_200"] += random.randint(2, 10)
                  if random.random() < 0.1:
                      counters["demo_requests_total_get_404"] += 1
                  if random.random() < 0.05:
                      counters["demo_requests_total_post_500"] += 1
                      counters["demo_errors_total_timeout"] += 1
                  if random.random() < 0.03:
                      counters["demo_errors_total_connection"] += 1
                  time.sleep(5)

          threading.Thread(target=increment, daemon=True).start()

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path != "/metrics":
                      self.send_response(404); self.end_headers(); return
                  lines = [
                      "# HELP demo_requests_total Total HTTP requests handled",
                      "# TYPE demo_requests_total counter",
                      f'demo_requests_total{{method="GET",status="200"}} {counters["demo_requests_total_get_200"]}',
                      f'demo_requests_total{{method="GET",status="404"}} {counters["demo_requests_total_get_404"]}',
                      f'demo_requests_total{{method="POST",status="200"}} {counters["demo_requests_total_post_200"]}',
                      f'demo_requests_total{{method="POST",status="500"}} {counters["demo_requests_total_post_500"]}',
                      "# HELP demo_request_duration_seconds Request latency in seconds",
                      "# TYPE demo_request_duration_seconds gauge",
                      f'demo_request_duration_seconds{{method="GET"}} {round(random.uniform(0.01, 0.3), 4)}',
                      f'demo_request_duration_seconds{{method="POST"}} {round(random.uniform(0.05, 0.8), 4)}',
                      "# HELP demo_active_connections Current open connections",
                      "# TYPE demo_active_connections gauge",
                      f"demo_active_connections {random.randint(1, 50)}",
                      "# HELP demo_errors_total Total errors by type",
                      "# TYPE demo_errors_total counter",
                      f'demo_errors_total{{type="timeout"}} {counters["demo_errors_total_timeout"]}',
                      f'demo_errors_total{{type="connection"}} {counters["demo_errors_total_connection"]}',
                  ]
                  body = "\n".join(lines) + "\n"
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain; version=0.0.4")
                  self.end_headers()
                  self.wfile.write(body.encode())
              def log_message(self, *args):
                  pass  # suppress access logs

          http.server.HTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-demo
  namespace: steve
  labels:
    app: metrics-demo
spec:
  selector:
    app: metrics-demo
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
